name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,web]' build
      - run: python -m unittest discover -s tests -v
      - run: python -m journal_suggester.experiment verify-results
      - run: python -m build
      - name: Check installed wheel outside the checkout
        run: |
          python -m venv /tmp/journal-wheel-check
          /tmp/journal-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/journal-wheel-check/bin/python - <<'PY'
          from journal_suggester.io import journals, read_json
          from journal_suggester.resources import ROOT
          assert len(journals()) == 95
          assert read_json("configs/models.json")["embedding_model"] == "Qwen/Qwen3-Embedding-8B"
          assert read_json(ROOT / "results/data-audit.json")["checks_pass"]
          PY
