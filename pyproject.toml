[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-suggester"
version = "2.0.0"
description = "Math journal recommendations with fine-tuned Kev"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/kev-LICENSE", "licenses/triton-LICENSE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["numpy==2.3.3"]
web = ["waitress==3.0.2"]

[project.scripts]
journal-suggester = "journal_suggester.cli:main"

[tool.setuptools.packages.find]
include = ["journal_suggester*"]

[tool.setuptools.package-data]
journal_suggester = [
    "web/index.html", "web/methodology.html", "web/app.css", "web/app.js",
    "resources/configs/models.json", "resources/configs/kev-only.json",
    "resources/configs/website-kev.json", "resources/data/journals.csv",
    "resources/results/test.json", "resources/results/tuning.json",
    "resources/results/training.json", "resources/results/config.json", "resources/configs/release.json",
]
